# App Version Configuration
#
# versionName: Semantic version displayed to users (e.g., "1.0.0", "1.1.0", "2.0.0")
#              Format: Major.Minor.Patch
#              - Major: Breaking changes or major features
#              - Minor: New features, backward compatible
#              - Patch: Bug fixes only
#
# versionCode: Integer version for Google Play (must always increase)
#              - Start at 1 for first release
#              - Increment by 1 for each new release to Google Play
#              - NEVER decrease this number
#              - Maximum value: 2,100,000,000
#
# IMPORTANT: Increment BOTH values before each Google Play release!
#
# Example release sequence:
#   1.0.0 (1)  -> Initial release
#   1.0.1 (2)  -> Bug fix
#   1.1.0 (3)  -> New feature
#   2.0.0 (4)  -> Major update

versionName=1.0.0
versionCode=1
